<!DOCTYPE html>
<!-- Created by Yuqi Hang (github.com/yh2072) -->
<html lang="{{ ui.lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>{{ title }} — {{ subtitle }}</title>
<script>window.PIXELPACK_BASE = "/assets/pixelpack/";</script>
<style>
/* ══ Palettes ══════════════════════════════════════════════════════════════
   Every colour in this file is a custom property, declared twice: the theme's
   authored dark palette, and a light one derived from it with the contrast of
   each text/background pair verified (see generator/theme_light.py). Baking
   the values in made the look fixed at generation time; as properties the same
   file can be either, switched on <html data-appearance>. */
:root{
{%- for key, value in theme.items() %}
  --t-{{ key }}: {{ value }};
{%- endfor %}
}
:root[data-appearance="light"]{
{%- for key, value in theme_light.items() %}
  --t-{{ key }}: {{ value }};
{%- endfor %}
}

/* ══ Pixel-UI kit ══════════════════════════════════════════════════════════
   The dialogue frame, the hearts and the action buttons are the pixel pack's
   own UI, not the theme's. These are its colours, read straight out of
   ui/Dialog/DialogBoxFaceset.png and ui/Receptacle/Heart.png, so the CSS
   panel and the sprite art line up pixel for pixel.

   Each one defers to a theme key first. No theme defines them today, so every
   course gets the pack's look; a theme that wants to tint its chrome only has
   to emit `uiGold`, `uiPaper` and friends — no CSS changes here. */
:root{
  --ui-ink:        var(--t-uiInk,       #141b1b);  /* sprite outline        */
  --ui-wood:       var(--t-uiWood,      #965340);  /* name tab, under-edge  */
  --ui-gold:       var(--t-uiGold,      #ffad5d);  /* panel inner border    */
  --ui-paper:      var(--t-uiPaper,     #f2eaf1);  /* panel fill            */
  --ui-paper-ink:  var(--t-uiPaperInk,  #2e2430);  /* type on paper         */
  --ui-tab-ink:    var(--t-uiTabInk,    #e8d6c6);  /* type on the name tab  */
  --ui-sage:       var(--t-uiSage,      #8d977f);  /* portrait frame        */
  --ui-orange:     var(--t-uiOrange,    #f16734);  /* action buttons        */
  --ui-orange-lit: var(--t-uiOrangeLit, #fb9a4d);  /* their top bevel       */
  --ui-btn-ink:    var(--t-uiBtnInk,    #fff6ec);  /* type on a button      */
}

@font-face{font-family:'PixelLatin';src:url('/assets/pixelpack/ui/Font/NormalFont.ttf') format('truetype');font-display:swap}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%;min-height:100dvh;-webkit-text-size-adjust:100%}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb, var(--t-text) 12%, transparent);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb, var(--t-text) 25%, transparent)}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb, var(--t-text) 12%, transparent) transparent}
body{background:var(--t-bg);display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;font-family:ui-monospace,'SF Mono',Menlo,'Courier New',monospace;overflow:hidden}
#game-container{position:relative;width:768px;height:576px;border:3px solid var(--t-border);border-radius:12px;overflow:hidden;background:var(--t-containerBg);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);box-shadow:0 4px 40px rgba(0,0,0,0.25), inset 0 1px 0 color-mix(in srgb, var(--t-text) 4%, transparent), 0 0 40px var(--t-glow);z-index:10}
canvas#main{width:768px;height:576px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
#ui-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#character-layer{position:absolute;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}
.char-sprite{image-rendering:pixelated;image-rendering:crisp-edges;filter:drop-shadow(0 6px 12px rgba(0,0,0,0.45))}
.char-wrapper{position:absolute;bottom:155px;pointer-events:none;display:flex;flex-direction:column;align-items:center;transition:opacity 0.3s ease,filter 0.3s ease,transform 0.3s ease;transform-origin:bottom center}
.char-wrapper.speaking{filter:drop-shadow(0 0 10px var(--t-glow));transform:translateY(-4px)}
.char-wrapper.silent{filter:brightness(0.5);opacity:0.7}
.char-name-tag{color:var(--t-highlight);font-size:11px;background:var(--t-dialogBg);border:1px solid var(--t-glowSoft);border-radius:8px;padding:2px 8px;white-space:nowrap;pointer-events:none;margin-bottom:4px;opacity:0;transition:opacity 0.3s;letter-spacing:1px}
.char-wrapper.speaking .char-name-tag{opacity:1}
#dialog-click-area{position:absolute;bottom:0;left:0;right:0;height:180px;pointer-events:auto;cursor:pointer;z-index:6}
/* The dialogue is three pieces, not one panel: a name tab, a framed portrait
   and the paper the line is printed on. Laying it out as a flex row is what
   lets the portrait column disappear (.no-face) for a speaker with no art —
   the tab then sits straight on the paper, exactly like the pack's plain
   DialogBox sprite, instead of leaving a hole. */
#dialog-box{position:absolute;bottom:16px;left:18px;right:18px;display:none;align-items:flex-end;pointer-events:auto;z-index:7;cursor:pointer}
#dialog-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;position:relative;z-index:2;margin-right:-8px}
#dialog-box.no-face{flex-direction:column;align-items:stretch}
#dialog-box.no-face #dialog-side{margin-right:0;align-self:flex-start}
#dialog-box.no-face #dialog-portrait{display:none}
#dialog-name{margin-left:8px;margin-bottom:-6px;padding:4px 18px 8px;background:var(--ui-wood);border:3px solid var(--ui-ink);border-bottom:none;border-radius:9px 9px 0 0;color:var(--ui-tab-ink);font-size:13px;letter-spacing:2px;white-space:nowrap;font-family:'PixelLatin',system-ui,-apple-system,sans-serif}
#dialog-name:empty{display:none}
#dialog-portrait{width:112px;height:112px;padding:6px;background:var(--ui-sage);border:3px solid var(--ui-ink);border-radius:7px;box-sizing:border-box}
#dialog-portrait-inner{width:100%;height:100%;background:#141b1b;border:2px solid var(--ui-ink);display:flex;align-items:flex-start;justify-content:center;overflow:hidden}
#dialog-portrait-inner img,#dialog-portrait-inner canvas{image-rendering:pixelated;display:block}
#dialog-portrait-inner img{width:92px;height:92px;margin-top:1px}
#dialog-portrait-inner canvas{width:84px !important;height:126px !important;margin-top:4px}
#dialog-panel{flex:1 1 auto;min-width:0;min-height:112px;background:var(--ui-paper);border:3px solid var(--ui-ink);border-radius:9px;box-shadow:inset 0 0 0 4px var(--ui-gold);padding:18px 26px 20px;position:relative}
#dialog-text{color:var(--ui-paper-ink);font-size:14px;line-height:1.8;min-height:46px;letter-spacing:0.3px;word-break:break-word}
/* The pack's "continue" cue is a chevron badge, so it is a clipped box with a
   smaller clipped box inside it — one element, no second image to load. */
#dialog-next{position:absolute;right:16px;bottom:12px;width:26px;height:22px;background:var(--ui-ink);clip-path:polygon(0 0,100% 0,100% 52%,50% 100%,0 52%);font-size:0;animation:dialogBob 1s ease-in-out infinite}
#dialog-next::after{content:'';position:absolute;left:4px;right:4px;top:4px;bottom:5px;background:var(--ui-paper);clip-path:polygon(0 0,100% 0,100% 50%,50% 100%,0 50%)}
@keyframes dialogBob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
/* ══ Life hearts ═══════════════════════════════════════════════════════════
   Heart.png is 80x16 — five 16px quarter-fill frames — so one row of five
   hearts addressed by background-position is a 20-step meter for the price of
   one image. The row only appears once PixelPack has answered: with no pack
   there is no art to show, and the chapter dots stay the whole display. */
#chapter-bar,#hp-hearts{visibility:hidden}
#game-container.playing #chapter-bar,#game-container.playing #hp-hearts{visibility:visible}
#hp-hearts{position:absolute;top:12px;left:16px;display:none;gap:3px;z-index:9;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,0.35))}
#hp-hearts.on{display:flex}
.hp-heart{width:34px;height:34px;background-repeat:no-repeat;background-size:170px 34px;image-rendering:pixelated}
#chapter-bar{position:absolute;top:10px;left:20px;right:20px;display:flex;gap:4px;pointer-events:none}
#chapter-bar.under-hearts{top:56px;right:auto;width:176px;opacity:0.7}
.ch-dot{position:relative;width:20px;height:6px;background:var(--t-dotBg);border-radius:3px;transition:background 0.3s}
.ch-dot.active{background:var(--t-accent)}
.ch-dot.done{background:var(--t-success)}
.ch-dot .ch-stars{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:6px;color:var(--t-accent);white-space:nowrap;opacity:0;transition:opacity 0.3s}
.ch-dot.done .ch-stars{opacity:1}
#xp-bar{position:absolute;top:22px;left:20px;right:20px;pointer-events:none;display:none;z-index:8}
#xp-track{height:4px;background:color-mix(in srgb, var(--t-text) 6%, transparent);border-radius:2px;overflow:hidden}
#xp-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--t-accent),var(--t-success));border-radius:2px;transition:width 0.6s ease}
#xp-label{color:var(--t-muted);font-size:9px;margin-top:2px;text-align:right;letter-spacing:0.5px}
#chapter-transition{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb, var(--t-containerBg) 88%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:18;pointer-events:auto;cursor:pointer}
@keyframes chapterSlide{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
#level-up-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:color-mix(in srgb, var(--t-containerBg) 88%, transparent);z-index:19;pointer-events:none}
@keyframes levelUpPop{0%{opacity:0;transform:scale(0.5)}60%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
#score-feedback{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);display:none;z-index:17;pointer-events:none;text-align:center}
@keyframes scorePop{0%{opacity:0;transform:scale(0.6)}50%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes scoreFloat{0%{opacity:1;transform:translate(-50%,-50%) translateY(0)}100%{opacity:0;transform:translate(-50%,-50%) translateY(-30px)}}
#title-screen,#mini-game-overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
#title-screen{background:color-mix(in srgb, var(--t-containerBg) 88%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:20}
#title-screen h1{color:var(--t-highlight);font-size:26px;letter-spacing:3px;margin-bottom:8px;text-shadow:0 0 20px var(--t-glow)}
#title-screen .subtitle{color:var(--t-muted);font-size:13px;margin-bottom:10px}
#title-screen .start-btn{padding:12px 40px;background:var(--t-buttonBg);color:var(--t-highlight);border:2px solid var(--t-accent);border-radius:20px;font-family:inherit;font-size:15px;cursor:pointer;transition:all 0.2s}
#title-screen .start-btn:hover{background:var(--t-buttonHover);transform:scale(1.05);box-shadow:0 0 16px var(--t-glowAccent)}
#name-input-group{display:flex;align-items:center;gap:8px;margin-bottom:14px}
#name-input-group label{color:var(--t-muted);font-size:12px}
#player-name-input{width:140px;padding:6px 10px;background:var(--t-bg);border:2px solid var(--t-inputBorder);border-radius:12px;color:var(--t-highlight);font-family:inherit;font-size:14px;text-align:center;outline:none;transition:border-color 0.2s}
#player-name-input:focus{border-color:var(--t-accent)}
#player-name-input::placeholder{color:var(--t-muted);font-size:12px}
#mini-game-overlay{background:color-mix(in srgb, var(--t-containerBg) 88%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:15;display:none;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 24px;justify-content:flex-start}
#mini-game-overlay>*{max-width:100%;box-sizing:border-box}
#mini-game-overlay,#mini-game-overlay *{font-family:ui-monospace,'SF Mono',Menlo,'Courier New',monospace}
#mini-game-overlay div,#mini-game-overlay p,#mini-game-overlay span{word-wrap:break-word;overflow-wrap:break-word}
#particles-canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:16}
/* Buttons are solid blocks with a lit top edge and a wooden under-edge, so
   pressing one can move it down onto that edge. */
#audio-controls{position:absolute;top:14px;right:14px;z-index:25;display:flex;gap:8px;pointer-events:auto}
.audio-btn{width:36px;height:36px;background:var(--ui-orange);border:3px solid var(--ui-ink);border-radius:9px;color:var(--ui-btn-ink);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.12s,background 0.12s,box-shadow 0.12s;font-family:inherit;padding:0;box-shadow:inset 0 3px 0 var(--ui-orange-lit),inset 0 -4px 0 rgba(0,0,0,0.18),0 3px 0 var(--ui-wood)}
.audio-btn:hover{background:var(--ui-orange-lit);transform:translateY(-1px);box-shadow:inset 0 3px 0 #ffb877,inset 0 -4px 0 rgba(0,0,0,0.14),0 4px 0 var(--ui-wood)}
.audio-btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 var(--ui-orange-lit),0 0 0 var(--ui-wood)}
.audio-btn.muted{background:#8c7f78;color:#e8ded8;box-shadow:inset 0 3px 0 #a79a92,inset 0 -4px 0 rgba(0,0,0,0.2),0 3px 0 #4a403c}
.mg-header{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.mg-header canvas{image-rendering:pixelated;border:2px solid var(--t-border);border-radius:8px;background:var(--t-bg)}
.mg-header-text{text-align:left}
.mg-title{color:var(--t-highlight);font-size:18px;letter-spacing:2px}
.mg-instruction{color:var(--t-muted);font-size:12px;margin-bottom:16px;text-align:center;max-width:650px;line-height:1.5}
.mg-area{position:relative;width:100%;max-width:720px;min-height:200px;margin:0 auto}
.mg-btn{padding:8px 24px;background:var(--t-buttonBg);color:var(--t-text);border:2px solid var(--t-inputBorder);border-radius:12px;font-family:inherit;font-size:12px;cursor:pointer;margin:4px;transition:all 0.15s}
.mg-btn:hover{background:var(--t-buttonHover);border-color:var(--t-accent);box-shadow:0 0 8px var(--t-glowAccent)}
.mg-score{color:var(--t-highlight);font-size:14px;margin-top:12px}
.mg-complete{color:var(--t-success);font-size:16px;margin:16px 0}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-card{padding:10px 12px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:10px;color:var(--t-cardText);font-size:11px;cursor:pointer;transition:all 0.2s;line-height:1.3;user-select:none;display:flex;align-items:center;gap:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.match-card:hover{border-color:var(--t-accent);background:var(--t-cardHover);transform:translateY(-1px)}
.match-card.selected{border-color:var(--t-highlight);background:var(--t-cardHover);box-shadow:0 0 12px var(--t-glow)}
.match-card.matched{border-color:var(--t-success);background:var(--t-successBg);opacity:0.8;pointer-events:none}
.match-card.wrong-flash{border-color:#ff4a4a;background:var(--t-errorBg);animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.match-card canvas{flex-shrink:0;image-rendering:pixelated;border-radius:4px;max-width:32px;max-height:32px}
.match-card-text{flex:1}
.match-label{color:var(--t-accent);font-size:10px;margin-bottom:8px;letter-spacing:1px}
.formula-target{display:flex;gap:4px;align-items:center;justify-content:center;min-height:70px;padding:14px;background:var(--t-bg);border:2px dashed var(--t-border);border-radius:12px;margin-bottom:14px;flex-wrap:wrap}
.formula-slot{width:120px;height:44px;border:2px dashed var(--t-slotBorder);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--t-slotBorder);font-size:10px;transition:all 0.3s}
.formula-slot.filled{border-style:solid;border-color:var(--t-accent);color:var(--t-text);background:var(--t-cardBg)}
.formula-slot.correct-slot{border-color:var(--t-success);background:#1a2a1a;color:var(--t-success);animation:slotGlow 0.5s}
@keyframes slotGlow{0%{box-shadow:0 0 0 rgba(144,224,160,0)}50%{box-shadow:0 0 16px rgba(144,224,160,0.4)}100%{box-shadow:0 0 0 rgba(144,224,160,0)}}
.formula-slot canvas{image-rendering:pixelated}
.formula-piece{padding:8px 12px;background:var(--t-cardHover);border:2px solid var(--t-inputBorder);border-radius:10px;color:var(--t-text);font-size:11px;cursor:grab;transition:all 0.15s;user-select:none;display:inline-flex;align-items:center;gap:6px;margin:4px}
.formula-piece:hover{background:var(--t-buttonHover);border-color:var(--t-accent);transform:translateY(-2px)}
.formula-piece.used{opacity:0.3;pointer-events:none;transform:scale(0.9)}
.formula-op{color:var(--t-highlight);font-size:16px;margin:0 2px}
.sort-container{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sort-bucket{padding:12px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:12px;text-align:center;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sort-bucket:hover{border-color:var(--t-accent);background:var(--t-cardHover);transform:translateY(-2px)}
.sort-bucket canvas{image-rendering:pixelated;margin-bottom:6px}
.sort-bucket-title{color:var(--t-text);font-size:12px;margin-bottom:4px}
.sort-security{display:flex;align-items:center;gap:14px;padding:14px;background:var(--t-bg);border:2px solid var(--t-border);border-radius:12px;justify-content:center}
.sort-security canvas{image-rendering:pixelated;flex-shrink:0}
.ded-feedback{margin-top:6px;padding:8px;border-radius:8px;font-size:11px;line-height:1.5}
.ded-feedback.pass{background:var(--t-successBg);border:1px solid var(--t-success);color:var(--t-success)}
.ded-feedback.fail{background:var(--t-errorBg);border:1px solid #ff4a4a;color:#ff8a8a}
.search-area{position:relative;width:520px;height:300px;background:var(--t-containerBg);border:2px solid var(--t-cardHover);border-radius:12px;margin:0 auto;overflow:hidden}
.search-item{position:absolute;width:28px;height:28px;cursor:pointer;pointer-events:auto;transition:transform 0.1s;border:2px solid rgba(255,200,220,0.15);border-radius:2px}
.search-item:hover{transform:scale(1.15);z-index:2}
.search-item.found{animation:foundPulse 0.4s;pointer-events:none}
@keyframes foundPulse{0%{transform:scale(1)}50%{transform:scale(1.5);opacity:0.6}100%{transform:scale(0);opacity:0}}
.trial-info{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--t-bg);border:1px solid var(--t-cardHover);border-radius:8px;margin:8px auto;width:520px;font-size:11px;color:var(--t-muted)}
.rt-graph{margin:12px auto;display:block;image-rendering:auto;border:1px solid var(--t-cardHover);border-radius:8px}
.neuro-viz{display:flex;gap:12px;justify-content:center;margin:12px 0}
.neuro-viz canvas{image-rendering:auto;border:1px solid var(--t-cardHover);border-radius:8px;background:var(--t-containerBg)}
.pred-graph{cursor:crosshair;border:1px solid var(--t-border);border-radius:8px;display:block;margin:0 auto}
.brain-region{position:absolute;cursor:pointer;border:2px solid var(--t-glowAccent);border-radius:8px;transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t-muted)}
.brain-region:hover{border-color:var(--t-accent);background:rgba(255,106,154,0.15);transform:scale(1.05)}
.brain-region.discovered{border-color:var(--t-success);background:rgba(144,224,160,0.15);color:var(--t-success)}
.discovery-card{padding:10px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:10px;margin:4px 0;font-size:11px;color:var(--t-cardText);line-height:1.5;animation:cardAppear 0.4s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
@keyframes cardAppear{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
.activation-grid{display:grid;gap:2px;margin:0 auto}
.activation-cell{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.8);transition:all 0.3s;cursor:pointer;border:2px solid transparent}
.activation-cell:hover{transform:scale(1.1);z-index:2}
.activation-cell.selected-cell{border-color:var(--t-highlight);box-shadow:0 0 10px var(--t-glow)}
.seq-timeline{display:flex;align-items:center;gap:4px;padding:14px;background:var(--t-bg);border:2px dashed var(--t-border);border-radius:12px;margin-bottom:14px;flex-wrap:wrap;justify-content:center;min-height:70px}
.seq-slot{width:100px;height:44px;border:2px dashed var(--t-slotBorder);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--t-muted);transition:all 0.3s}
.seq-slot.filled{border-style:solid;border-color:var(--t-accent);color:var(--t-text);background:var(--t-cardBg)}
.resource-panel{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.resource-card{padding:12px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:10px;text-align:center;min-width:100px;transition:all 0.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.resource-card:hover{border-color:var(--t-accent);transform:translateY(-2px)}
.opt-slider-group{margin:10px 0}
.opt-slider-group label{display:flex;justify-content:space-between;font-size:11px;color:var(--t-muted);margin-bottom:4px}
.opt-slider-group input[type="range"]{width:100%;accent-color:var(--t-accent)}
.pattern-row{display:flex;gap:6px;align-items:center;justify-content:center;margin:8px 0}
.pattern-cell{width:40px;height:40px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.2s}
.pattern-cell.blank{border-style:dashed;cursor:pointer}
.pattern-cell.blank:hover{border-color:var(--t-accent);background:var(--t-cardHover)}
.nav-node{position:absolute;width:36px;height:36px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t-text);cursor:pointer;transition:all 0.2s;z-index:2;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav-node:hover{border-color:var(--t-accent);transform:scale(1.1)}
.nav-node.visited{border-color:var(--t-success);background:var(--t-successBg)}
.nav-node.current{border-color:var(--t-accent);box-shadow:0 0 12px var(--t-glowAccent);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 8px var(--t-glowAccent)}50%{box-shadow:0 0 20px var(--t-glowAccent)}}
.collection-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.collection-item{padding:8px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:10px;text-align:center;cursor:pointer;transition:all 0.2s;min-height:60px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.collection-item:hover{border-color:var(--t-accent);transform:translateY(-2px)}
.collection-item.collected{border-color:var(--t-success);background:var(--t-successBg)}
.decision-card{padding:10px 14px;background:var(--t-cardBg);border:2px solid var(--t-border);border-radius:12px;margin:6px 0;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.decision-card:hover{border-color:var(--t-accent);background:var(--t-cardHover);transform:translateX(4px)}
#back-to-course{position:fixed;top:12px;left:12px;z-index:50;padding:6px 14px;background:color-mix(in srgb, var(--t-containerBg) 88%, transparent);border:2px solid var(--t-border);border-radius:10px;color:var(--t-muted);font-family:inherit;font-size:11px;cursor:pointer;transition:all 0.2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#back-to-course:hover{border-color:var(--t-accent);color:var(--t-highlight);background:rgba(50,20,46,0.9)}
.lang-switcher .lang-opt{transition:border-color 0.2s,color 0.2s,background 0.2s}
.lang-switcher .lang-opt:hover{border-color:var(--t-accent);color:var(--t-highlight);background:color-mix(in srgb, var(--t-text) 6%, transparent)}
.lang-switcher .lang-opt.active{border-color:var(--t-accent);color:var(--t-highlight);background:color-mix(in srgb, var(--t-text) 8%, transparent)}
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text}

<div id="game-settings" role="dialog" aria-modal="true">
  <div id="game-settings-inner">
    <h3>{{ ui.settings | default('Settings') }}</h3>
    <label class="gs-row"><span>{{ ui.nameLabel }}</span>
      <input type="text" id="player-name-setting" placeholder="{{ ui.namePlaceholder }}" maxlength="12">
    </label>
    <div class="gs-row"><span>{{ ui.appearance | default('Appearance') }}</span>
      <div class="gs-appearance">
        <button type="button" class="lang-opt" data-appearance="dark" onclick="setGameAppearance('dark')">{{ ui.dark | default('Dark') }}</button>
        <button type="button" class="lang-opt" data-appearance="light" onclick="setGameAppearance('light')">{{ ui.light | default('Light') }}</button>
      </div>
    </div>
    <div class="gs-row gs-langs"><span>{{ ui.language | default('Language') }}</span>
      <div id="lang-switcher-settings" class="lang-switcher">
        {% for code, name in locale_names.items() %}
        <button type="button" class="lang-opt" data-lang="{{ code }}" title="{{ name }}">{{ name }}</button>
        {% endfor %}
      </div>
    </div>
    <button type="button" class="mg-btn" onclick="toggleGameSettings()">{{ ui.close | default('Close') }}</button>
  </div>
</div>

<script>
(function () {
  // The name used to live on the title screen; it now lives in settings and is
  // remembered, so a returning player never retypes it.
  var KEY = 'edgc_player_name';
  function field() { return document.getElementById('player-name-setting'); }
  function hidden() { return document.getElementById('player-name-input'); }

  window.toggleGameSettings = function () {
    var panel = document.getElementById('game-settings');
    if (!panel) return;
    var opening = !panel.classList.contains('open');
    if (opening) {
      var saved = '';
      try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
      if (field()) field().value = saved;
    }
    panel.classList.toggle('open', opening);
  };

  document.addEventListener('input', function (e) {
    if (!e.target || e.target.id !== 'player-name-setting') return;
    var value = e.target.value.trim();
    try { localStorage.setItem(KEY, value); } catch (err) {}
    // The engine still reads the original input, so keep it in step.
    if (hidden()) hidden().value = value;
  });

  // Language buttons in settings drive the same handler as the old ones.
  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest && e.target.closest('#lang-switcher-settings .lang-opt');
    if (!btn) return;
    var twin = document.querySelector('#lang-switcher .lang-opt[data-lang="' + btn.dataset.lang + '"]');
    if (twin) twin.click();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var panel = document.getElementById('game-settings');
    if (panel && panel.classList.contains('open')) window.toggleGameSettings();
  });

  // Restore the saved name into the engine's field before the game starts.
  function restore() {
    var saved = '';
    try { saved = localStorage.getItem(KEY) || ''; } catch (e) {}
    if (saved && hidden()) hidden().value = saved;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', restore);
  else restore();
})();
</script>

<script>
/* The title screen used to open onto an empty canvas behind a tinted veil —
   the generated backgrounds were only drawn once the script started running.
   Drawing scene 0 up front makes the world the title art, which is the whole
   point of generating it.

   It repaints after PixelPack resolves because sprite art loads as images: the
   first pass draws whatever has decoded, and anything that arrived late would
   otherwise be missing until the player pressed start. */
(function () {
  function paintTitleBackdrop() {
    try {
      if (typeof renderScene !== 'function') return;
      if (typeof BACKGROUNDS === 'undefined' || !BACKGROUNDS || !BACKGROUNDS.length) return;
      renderScene(0, []);
    } catch (e) { /* a background that throws must not block the title */ }
  }
  window.paintTitleBackdrop = paintTitleBackdrop;
  function start() {
    paintTitleBackdrop();
    if (window.PixelPack && PixelPack.ready) {
      PixelPack.ready().then(function () {
        [120, 400, 1000].forEach(function (ms) { setTimeout(paintTitleBackdrop, ms); });
      });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<script>
window.setGameAppearance = function (mode) {
  document.documentElement.setAttribute('data-appearance', mode);
  try { localStorage.setItem('edgc_game_appearance', mode); } catch (e) {}
  document.querySelectorAll('.gs-appearance .lang-opt').forEach(function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.appearance === mode));
  });
};
document.addEventListener('DOMContentLoaded', function () {
  window.setGameAppearance(document.documentElement.getAttribute('data-appearance') || 'dark');
});
</script>
