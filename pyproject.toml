[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ahafrog"
version = "0.1.1"
description = "Self-hosted AI studio: turn learning materials into playable browser mini-games"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Yuqi Hang" }]
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.22.0",
  "python-multipart>=0.0.6",
  "aiofiles>=23.0.0",
  "httpx>=0.24.0",
  "python-dotenv>=1.0.0",
  "openai>=1.0.0",
  "esprima>=4.0.1",
  "jinja2>=3.1.0",
  "pypdf>=4.0.0",
]

[project.scripts]
ahafrog = "ahafrog.cli:main"

[project.urls]
Homepage = "https://github.com/yh2072/ahafrog"
Repository = "https://github.com/yh2072/ahafrog"
Documentation = "https://pypi.org/project/ahafrog/"

[tool.setuptools.packages.find]
where = ["."]
include = ["ahafrog*"]

[tool.setuptools.package-data]
# Omit readme/**/*.gif — GIFs are large; PyPI wheel stays small. Full demos: GitHub repo readme/.
ahafrog = [
  "static/**/*",
  "engine/**/*",
  "readme/**/*.png",
  "readme/**/*.jpg",
  "readme/**/*.jpeg",
  "readme/**/*.webp",
  "readme/**/*.svg",
  "readme/**/*.ico",
  "generator/sandbox_harness.js",
  "node/**/*",
]
